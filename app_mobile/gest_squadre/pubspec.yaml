name: gest_squadre
description: Tracking squadre operativo — app separata da TocAppBuild.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.12.2
  geolocator: ^14.0.2
  permission_handler: ^12.0.1
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  firebase_core: ^3.8.1
  firebase_messaging: ^15.2.10
  url_launcher: ^6.3.1
  flutter_local_notifications: ^18.0.1
  google_fonts: ^6.3.0
  flutter_map: ^8.3.0
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/app_icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/app_icon.png

flutter:
  uses-material-design: true
  assets:
    - assets/logo_ansmi.png
    - assets/logo_open_golf_2026.png
    - assets/waypoint_buche.png
    - assets/waypoint_croce_rossa.png
    - assets/waypoint_club_house.png
    - assets/waypoint_cancello_in.png
    - assets/waypoint_driving_range.png
    - assets/waypoint_villaggio_comm.png
    - assets/waypoint_welcome.png
    - assets/waypoint_media_center.png
    - assets/firebase/
    - assets/app_icon.png
